<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North Travel</title>
    <link rel="stylesheet" href="fizetes.css">
</head>
<body>
    <header class="fejlec">
        <div id="cimDiv">
        <p class="cim">North Travel Utazási iroda</p>
        </div>
        <img src="Képek/ChatGPT Image 2025. nov. 3. 09_29_13.png" class="logo">
    </header>

    <h1>Fizetés</h1>

    <h2>Kártyaszám</h2>
    <input type="text" placeholder="Kártyaszám" id="cardNumber">

    <h2>Lejárat</h2>
    <input type="number" placeholder="Lejárat" id="expiryDate">

    <h2>Telekód</h2>
    <input type="number" placeholder="Telekód" id="cvv">

    <h2>Számlázási cím</h2>
    <input type="text" placeholder="Számlázási cím" id="billingAddress">

    <button id="payButton" id="payButton">Fizetés</button>

    
</body>
</html>
